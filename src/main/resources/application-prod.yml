spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

  sql:
    init:
      mode: never  # schema.sql(CREATE INDEX CONCURRENTLY)을 기동에 묶지 않음 — 배포/마이그레이션 단계에서 별도 적용 (ADR-0005)

external:
  api:
    tour-api:
      service-key: ${TOUR_API_KEY}

jwt:
  secret: ${JWT_SECRET}
  cookie-secure: ${JWT_COOKIE_SECURE:true}
