spring:
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}

  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

external:
  api:
    tour-api:
      service-key: ${TOUR_API_KEY}

jwt:
  secret: ${JWT_SECRET}
  cookie-secure: ${JWT_COOKIE_SECURE:true}
