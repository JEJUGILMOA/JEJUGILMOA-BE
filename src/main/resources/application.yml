spring:
  application:
    name: jejugilmoa

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    baseline-on-migrate: true
    baseline-version: 0

server:
  shutdown: graceful

jwt:
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}    # 30분
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}  # 14일
  cookie-secure: ${JWT_COOKIE_SECURE:false}

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:}
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      redirect-uri: ${NAVER_REDIRECT_URI:}
      token-uri: https://nid.naver.com/oauth2.0/token
      user-info-uri: https://openapi.naver.com/v1/nid/me
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

external:
  api:
    tour-api:
      service-key: ${TOUR_API_KEY}
      base-url: https://apis.data.go.kr/B551011/TarRlteTarService1
    visitor-data:
      service-key: ${VISITOR_DATA_API_KEY:}
      base-url: ${VISITOR_DATA_BASE_URL:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: list
    tags-sorter: alpha
    operations-sorter: alpha

  api-docs:
    path: /v3/api-docs
    enabled: true
