spring:
  application:
    name: jejugilmoa

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  jpa:
    open-in-view: false
    properties:
      hibernate:
        default_batch_fetch_size: 100

  flyway:
    baseline-on-migrate: true
    baseline-version: 1
    # CREATE INDEX CONCURRENTLY 등 트랜잭션 밖에서 실행되어야 하는 구문을 포함한
    # 마이그레이션을 허용한다 (예: V3__badge_condition_index_concurrently.sql).
    mixed: true
    postgresql:
      # Flyway 기본값(true)은 세션 락을 트랜잭션으로 감싸서 잡는데, 이 트랜잭션이
      # CREATE INDEX CONCURRENTLY가 기다리는 "이전에 열린 트랜잭션"에 해당되어
      # 마이그레이션이 영구히 멈춘다. false로 설정해 트랜잭션 없이 세션 수준 advisory
      # lock만 사용하도록 한다.
      transactional-lock: false

server:
  shutdown: graceful

aws:
  region: ${AWS_REGION:ap-northeast-2}
  s3:
    bucket: ${AWS_S3_BUCKET:jejugilmoa-dev-images-bk}
    presign-expiration-seconds: ${AWS_S3_PRESIGN_EXPIRATION_SECONDS:600}
    max-image-size-bytes: ${AWS_S3_MAX_IMAGE_SIZE_BYTES:10485760}

jwt:
  access-token-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:1800000}    # 30분
  refresh-token-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:1209600000}  # 14일
  cookie-secure: ${JWT_COOKIE_SECURE:false}

app:
  location-usage:
    retention:
      enabled: ${LOCATION_USAGE_RETENTION_ENABLED:true}
      cron: ${LOCATION_USAGE_RETENTION_CRON:0 30 3 * * *}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:5173}
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:}
      token-uri: https://kauth.kakao.com/oauth/token
      user-info-uri: https://kapi.kakao.com/v2/user/me
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      redirect-uri: ${NAVER_REDIRECT_URI:}
      token-uri: https://nid.naver.com/oauth2.0/token
      user-info-uri: https://openapi.naver.com/v1/nid/me
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:}
      token-uri: https://oauth2.googleapis.com/token
      user-info-uri: https://www.googleapis.com/oauth2/v3/userinfo

external:
  api:
    tour-api:
      service-key: ${TOUR_API_KEY}
      base-url: https://apis.data.go.kr/B551011/TarRlteTarService1
    visitor-data:
      service-key: ${VISITOR_DATA_API_KEY:}
      base-url: ${VISITOR_DATA_BASE_URL:}

firebase:
  credentials:
    encoded: ${FIREBASE_CREDENTIALS_JSON:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    doc-expansion: list
    tags-sorter: alpha
    operations-sorter: alpha

  api-docs:
    path: /v3/api-docs
    enabled: true
